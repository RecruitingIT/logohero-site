<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-6">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set or reset your Logo Hero portal password.">
  <title>Set Password | Logo Hero</title>
  <link rel="icon" href="/LOGO%20HERO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Darker+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #0A45E0; --blue-dark: #0A2A8F; --ink: #0E1B3D; --muted: #55607A; --line: #DDE3F0; --bg: #EEF0F3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 500 20px/1.3 "Darker Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 18px 24px; border-bottom: 1px solid var(--line); }
    header .bar { max-width: 1040px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header img { display: block; width: auto; height: 58px; }
    .back { color: var(--blue); font-weight: 700; text-decoration: none; }
    main { flex: 1; display: grid; place-items: center; padding: 48px 24px; }
    .card { width: min(100%, 460px); padding: 40px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 16px 42px rgba(14, 27, 61, .08); }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 16px; font-weight: 800; letter-spacing: 1.7px; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font: 700 42px/1 "Barlow Condensed", sans-serif; letter-spacing: .5px; text-transform: uppercase; }
    .intro { margin: 0 0 28px; color: var(--muted); font-size: 21px; }
    label { display: block; margin: 0 0 6px; font-size: 19px; font-weight: 700; }
    input { width: 100%; min-height: 52px; margin: 0 0 20px; padding: 11px 14px; border: 1px solid #BFC9DC; border-radius: 9px; background: #fff; color: var(--ink); font: inherit; }
    input:focus { border-color: var(--blue); outline: 3px solid rgba(10, 69, 224, .16); }
    button { width: 100%; min-height: 54px; margin-top: 4px; border: 2px solid var(--blue); border-radius: 10px; background: var(--blue); color: #fff; font: 700 21px "Darker Grotesque", sans-serif; cursor: pointer; }
    button:hover { border-color: var(--blue-dark); background: var(--blue-dark); }
    .status { min-height: 1.4em; margin: 14px 0 0; color: var(--muted); font-size: 17px; }
    footer { padding: 20px 24px; color: var(--muted); text-align: center; font-size: 17px; }
    @media (max-width: 520px) { header img { height: 48px; } .card { padding: 30px 24px; } h1 { font-size: 36px; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a href="/" aria-label="Logo Hero home"><img src="/LOGO%20HERO.png" alt="Logo Hero"></a>
      <a class="back" href="/client-login.html">Back to sign in</a>
    </div>
  </header>
  <main>
    <section class="card" aria-labelledby="password-title">
      <p class="eyebrow">Customer area</p>
      <h1 id="password-title">Choose a password</h1>
      <p class="intro" id="intro">Use at least 6 characters and choose a password you don’t use on other sites.</p>
      <form id="password-form" hidden>
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
        <button type="submit">Save password</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite">Checking your secure link…</p>
    </section>
  </main>
  <footer>© <span id="year"></span> Logo Hero</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const supabaseClient = window.supabase.createClient(
      'https://nnyuapzufrzucvpoczjv.supabase.co',
      'sb_publishable_-svOFUFfYM47A9E-XSB6Jw_9mjJGzif'
    );
    const form = document.getElementById('password-form');
    const statusEl = document.getElementById('status');

    async function preparePasswordForm() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error || !session) {
        document.getElementById('password-title').textContent = 'Link expired';
        document.getElementById('intro').textContent = 'Request a fresh password setup email from the sign-in page.';
        statusEl.textContent = '';
        return;
      }
      form.hidden = false;
      statusEl.textContent = '';
    }
    preparePasswordForm();

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password').value;
      if (password !== confirmation) {
        statusEl.textContent = 'Those passwords don’t match. Please try again.';
        return;
      }
      const button = form.querySelector('button');
      button.disabled = true;
      statusEl.textContent = 'Saving your password…';
      const { error } = await supabaseClient.auth.updateUser({ password });
      button.disabled = false;
      if (error) {
        statusEl.textContent = 'We couldn’t save that password. Please try a different one or request a fresh link.';
        return;
      }
      statusEl.textContent = 'Password saved. Taking you to your portal…';
      window.setTimeout(() => window.location.replace('/client-portal.html'), 700);
    });
  </script>
</body>
</html>
