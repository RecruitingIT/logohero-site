<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your private Logo Hero customer portal.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Your Customer Portal | Logo Hero</title>
  <link rel="icon" href="/LOGO%20HERO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #0A45E0; --blue-dark: #0A2A8F; --ink: #0E1B3D; --muted: #55607A; --line: #DDE3F0; --soft: #F3F6FC; --bg: #EEF0F3; --orange: #FF8226; }
    html { -webkit-tap-highlight-color: transparent; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: var(--ink); color: var(--ink); font: 500 20px/1.3 "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--bg); }
    header .bar { max-width: 1040px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header img { display: block; width: auto; height: 58px; }
    /* ---------- Menu button (two lines) + pop-up menu (same as other pages) ---------- */
    .menu-wrap { position: relative; display: flex; align-items: center; }
    .menu-btn {
      width: 48px; height: 48px;
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 7px; padding: 0; margin: 0;
      border: 2px solid var(--line); border-radius: 10px;
      background: #fff; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    /* Same raised, lit-from-above look as the menu button on the home page. */
    .menu-btn {
      border-color: #CBD3E6;
      background-image: linear-gradient(180deg, #FFFFFF 0%, #F6F8FD 55%, #E6EBF6 100%);
      background-color: #F6F8FD;
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, .95),
        inset 0 -2px 3px rgba(14, 27, 61, .10),
        0 1px 0 rgba(255, 255, 255, .8),
        0 3px 6px rgba(14, 27, 61, .16),
        0 8px 14px -6px rgba(14, 27, 61, .18);
      transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    }
    .menu-btn:hover {
      background-image: linear-gradient(180deg, #FFFFFF 0%, #EEF2FB 55%, #DCE4F5 100%);
      background-color: #EEF2FB;
      border-color: var(--blue);
    }
    .menu-btn:active, .menu-btn[aria-expanded="true"] {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 4px rgba(14, 27, 61, .22),
        inset 0 -1px 0 rgba(255, 255, 255, .7),
        0 1px 2px rgba(14, 27, 61, .12);
    }
    .menu-btn:focus-visible { outline: 3px solid rgba(10, 69, 224, .35); outline-offset: 3px; }
    .menu-btn span {
      display: block; width: 22px; height: 3px; border-radius: 2px;
      background: var(--ink);
      transition: transform .2s ease, opacity .2s ease, background .2s ease, height .2s ease;
    }
    .menu-btn span:nth-child(2) { height: 4px; }
    .menu-btn[aria-expanded="true"] span { background: var(--blue); height: 3px; }
    .menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
    .menu-btn[aria-expanded="true"] span:nth-child(2) { opacity: 1; transform: translateY(-5px) rotate(-45deg); }
    .menu-panel {
      position: absolute; right: 0; top: calc(100% + 14px); z-index: 50;
      width: 300px; max-width: calc(100vw - 48px);
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 14px 34px rgba(14, 27, 61, .18);
      padding: 8px;
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
    }
    .menu-panel.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .menu-group { padding: 4px 0; }
    .menu-group + .menu-group { border-top: 1px solid var(--line); }
    .menu-panel a {
      display: block; padding: 12px 14px; border-radius: 8px;
      color: var(--ink); text-decoration: none; font-size: 22px; font-weight: 700;
    }
    .menu-panel a:hover, .menu-panel a:focus-visible { background: var(--soft); color: var(--blue); outline: none; }
    @media (prefers-reduced-motion: reduce) { .menu-panel, .menu-btn span { transition: none; } }

    @media (max-width: 760px) {
      .menu-btn { width: 40px; height: 40px; gap: 5px; }
      .menu-btn span { width: 20px; }
      .menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(4px) rotate(45deg); }
      .menu-btn[aria-expanded="true"] span:nth-child(2) { transform: translateY(-4px) rotate(-45deg); }
      .menu-panel a { font-size: 21px; }
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .contact-btn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--blue); border-radius: 10px; background: var(--blue); color: #fff; text-decoration: none; transition: background .15s, border-color .15s, transform .15s; }
    /* Same raised, lit-from-above look as the Get in touch envelope on the home page. */
    .contact-btn {
      background-image: linear-gradient(180deg, #4B7BF5 0%, #1A55E6 55%, #0A45E0 100%);
      background-color: #1A55E6;
      border-color: #2F63E8;
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, .4),
        inset 0 -2px 3px rgba(5, 20, 80, .18),
        0 3px 6px rgba(10, 42, 143, .20),
        0 8px 14px -6px rgba(10, 42, 143, .22);
      transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    }
    .contact-btn:hover {
      background-image: linear-gradient(180deg, #3F70EE 0%, #0F4BDB 55%, #0A3CC4 100%);
      background-color: #0F4BDB;
      border-color: #2457DD;
      transform: translateY(-1px);
    }
    .contact-btn:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 4px rgba(5, 20, 80, .5),
        inset 0 -1px 0 rgba(255, 255, 255, .25),
        0 1px 2px rgba(10, 42, 143, .2);
    }
    .contact-btn:focus-visible { outline: 3px solid rgba(10, 69, 224, .35); outline-offset: 3px; }
    .contact-btn svg { width: 22px; height: 22px; display: block; flex: 0 0 auto; filter: drop-shadow(0 -1px 0 rgba(5, 20, 80, .45)); }
    @media (max-width: 760px) { .header-actions { gap: 6px; } .contact-btn { width: 40px; height: 40px; } .contact-btn svg { width: 20px; height: 20px; } }
    main { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 64px 24px; }
    .card { padding: 40px; border: 2px solid var(--orange); border-radius: 16px; background: #fff; box-shadow: 0 14px 32px rgba(0, 0, 0, .35), 0 3px 8px rgba(0, 0, 0, .25); }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 16px; font-weight: 800; letter-spacing: 1.7px; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font: 700 clamp(36px, 7vw, 52px)/1 "Barlow Condensed", sans-serif; letter-spacing: .5px; text-transform: uppercase; }
    .status { min-height: 1.5em; margin: 18px 0 0; color: var(--muted); }
    /* The before/after section sits directly on the navy background (no box), like the home page sections. */
    .card.showcase { margin-top: 28px; padding: 40px 0; border: 0; border-radius: 0; background: none; box-shadow: none; }
    .showcase h2 { margin: 0 0 22px; font: 700 clamp(28px, 5vw, 38px)/1 "Barlow Condensed", sans-serif; letter-spacing: .5px; text-transform: uppercase; color: #fff; }
    .summary { margin: 0 0 28px; max-width: 70ch; color: rgba(255, 255, 255, .82); }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .pair figure { margin: 0; }
    .pair .frame { display: flex; align-items: center; justify-content: center; aspect-ratio: 4 / 3; padding: 18px; border: 2px solid var(--orange); border-radius: 14px; background: #fff; }
    .pair img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    .pair figcaption { margin-top: 12px; color: rgba(255, 255, 255, .82); font-weight: 800; font-size: 16px; letter-spacing: 1.7px; text-transform: uppercase; text-align: center; }
    .pair figure.after figcaption { color: var(--orange); }
    @media (max-width: 700px) { .pair { grid-template-columns: 1fr; } .card.showcase { padding: 30px 0; } }
    footer { padding: 20px 24px; color: rgba(255, 255, 255, .7); text-align: center; font-size: 17px; }
    @media (max-width: 520px) { header img { height: 48px; } main { padding: 36px 16px; } .card { padding: 30px 24px; } }
  </style>
<link rel="stylesheet" href="/menu-anim.css">
<script src="/menu-anim.js" defer></script>
<link rel="stylesheet" href="/fonts.css">
</head>
<body>
  <header>
    <div class="bar">
      <a href="/" aria-label="Logo Hero home"><img src="/LOGO%20HERO.png" alt="Logo Hero"></a>
      <div class="header-actions">
        <a class="contact-btn" href="mailto:branding@logohero.co.uk?subject=Logo%20Hero%20Enquiry" aria-label="Get in touch" title="Get in touch">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M3.5 6.5l8.5 6.5 8.5-6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <div class="menu-wrap">
          <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu-panel">
            <span></span><span></span>
          </button>
          <nav class="menu-panel" id="menu-panel" aria-label="Site menu">
            <div class="menu-group">
              <a href="/#top">Home</a>
            </div>
            <div class="menu-group"><a href="/privacy-notice">Privacy Policy</a></div>
            <div class="menu-group account-group" hidden>
              <a href="/set-password.html" id="password-link">Change password</a>
            </div>
            <div class="menu-group account-group" hidden>
              <a href="#" id="signout">Sign out</a>
            </div>
          </nav>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section class="card" aria-labelledby="portal-title">
      <h1 id="portal-title">Your Logo Hero portal</h1>
      <p class="status" id="portal-status" role="status" aria-live="polite">Checking your sign-in…</p>
    </section>
    <section class="card showcase" id="showcase" aria-labelledby="showcase-title" hidden>
      <h2 id="showcase-title">Before &amp; after</h2>
      <p class="summary" id="showcase-summary" hidden></p>
      <div class="pair" id="pair"></div>
    </section>
  </main>
  <footer>© <span id="year"></span> Logo Hero</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const supabaseClient = window.supabase.createClient(
      'https://nnyuapzufrzucvpoczjv.supabase.co',
      'sb_publishable_-svOFUFfYM47A9E-XSB6Jw_9mjJGzif'
    );
    const statusEl = document.getElementById('portal-status');
    const signoutButton = document.getElementById('signout');

    async function loadCustomerPage() {
      const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
      if (sessionError || !session) {
        window.location.replace('/client-login.html');
        return;
      }

      const { data: page, error } = await supabaseClient
        .from('customer_pages')
        .select('page_title, welcome_message, logo_summary')
        .eq('user_id', session.user.id)
        .maybeSingle();

      if (error) {
        statusEl.textContent = 'We couldn’t load your portal. Please try again later or contact Logo Hero.';
        return;
      }
      if (!page) {
        statusEl.textContent = 'Your account is signed in, but its customer page hasn’t been set up yet. Please contact Logo Hero.';
        return;
      }

      document.getElementById('portal-title').textContent = page.page_title;
      statusEl.textContent = page.welcome_message;
      document.querySelectorAll('.account-group').forEach(function (g) { g.hidden = false; });
      loadLogos(session.user.id, page.logo_summary);
    }


    // Before / after logos: every customer has a private folder in the storage bucket named after their user id.
    // Files with "before" / "after" in the name are shown side by side (private bucket, so short-lived signed links).
    async function loadLogos(userId, summary) {
      const { data: files, error } = await supabaseClient.storage.from('customer-portal-images').list(userId);
      if (error || !files) return;
      const pick = function (word) {
        return files.find(function (f) { return f.name.toLowerCase().includes(word) && /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name); });
      };
      const items = [['Before', pick('before')], ['After', pick('after')]].filter(function (i) { return i[1]; });
      if (!items.length) return;
      const { data: signed, error: signError } = await supabaseClient.storage
        .from('customer-portal-images')
        .createSignedUrls(items.map(function (i) { return userId + '/' + i[1].name; }), 3600);
      if (signError || !signed) return;
      const pair = document.getElementById('pair');
      items.forEach(function (item, idx) {
        if (!signed[idx] || !signed[idx].signedUrl) return;
        const fig = document.createElement('figure');
        fig.className = item[0].toLowerCase();
        const frame = document.createElement('div');
        frame.className = 'frame';
        const img = document.createElement('img');
        img.src = signed[idx].signedUrl;
        img.alt = item[0] + ' logo';
        frame.appendChild(img);
        const cap = document.createElement('figcaption');
        cap.textContent = item[0];
        fig.appendChild(frame);
        fig.appendChild(cap);
        pair.appendChild(fig);
      });
      if (pair.children.length) {
        if (summary) {
          const summaryEl = document.getElementById('showcase-summary');
          summaryEl.textContent = summary;
          summaryEl.hidden = false;
        }
        document.getElementById('showcase').hidden = false;
      }
    }

    signoutButton.addEventListener('click', async function (event) {
      event.preventDefault();
      await supabaseClient.auth.signOut();
      window.location.replace('/client-login.html');
    });

    /* Menu button behaviour (same as home page) */
    (function () {
      const btn = document.getElementById('menu-btn');
      const panel = document.getElementById('menu-panel');
      if (!btn || !panel) return;
      function isOpen() { return panel.classList.contains('open'); }
      function setOpen(open) {
        panel.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      }
      btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!isOpen()); });
      panel.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', function (e) { if (isOpen() && !panel.contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && isOpen()) { setOpen(false); btn.focus(); }
      });
      window.addEventListener('scroll', function () { if (isOpen()) setOpen(false); }, { passive: true });
    })();

    loadCustomerPage();
  </script>
</body>
</html>
